# Atualiza os dados do Mercado Central (servidor SA) a cada 6 horas.
# O site lê market/overview.json e market/items.json direto deste repositório.
name: Mercado Central

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coletar mercado
        run: python market/snapshot.py

      - name: Salvar
        run: |
          git config user.name "mercado-bot"
          git config user.email "mercado-bot@users.noreply.github.com"
          git add market
          if git diff --cached --quiet; then
            echo "Sem mudanças."
            exit 0
          fi
          git commit -m "Mercado: atualização automática $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
